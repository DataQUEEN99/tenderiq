version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tenderiq_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenderiq}
      POSTGRES_USER: ${POSTGRES_USER:-tenderiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderiq_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderiq} -d ${POSTGRES_DB:-tenderiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenderiq_network

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: tenderiq_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenderiq_network

  # Chroma DB for Vector Embeddings
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: tenderiq_chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      PERSIST_DIRECTORY: /chroma/chroma
      ALLOW_RESET: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenderiq_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenderiq_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tenderiq}:${POSTGRES_PASSWORD:-tenderiq_secure_password}@postgres:5432/${POSTGRES_DB:-tenderiq}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-tenderiq_documents}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-${SECRET_KEY:-your-super-secret-key-change-in-production}}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STORAGE_ROOT=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - VECTOR_STORE_DIR=/app/data/vectorstore
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - ENVIRONMENT=production
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - tenderiq_network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tenderiq_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - tenderiq_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  backend_data:

networks:
  tenderiq_network:
    driver: bridge