services:
  - type: web
    name: tenderiq-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenderiq-db
          property: connectionString
      - key: REDIS_URL
        value: redis://tenderiq-redis:6379/0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_PROVIDER
        value: groq
      - key: CHROMA_MODE
        value: local
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: RUN_WORKER
        value: "true"

databases:
  - name: tenderiq-db
    databaseName: tenderiq
    user: tenderiq
    plan: free
    region: oregon
